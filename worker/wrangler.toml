name = "bmw-repair-assistant-ask"
main = "src/worker.js"
compatibility_date = "2026-10-02"

# Per-IP rate limit. This is damage control, not the real spend ceiling, see
# the README: the hard ceiling is the DigitalOcean prepaid balance with
# auto-reload turned OFF.
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 8
  period = 60

[vars]
CORPUS_URL = "https://georgievalex.github.io/bmw-repair-assistant/data/index.json"
ALLOWED_ORIGIN = "https://georgievalex.github.io"
# Confirmed against GET https://inference.do-ai.run/v1/models on 2026-10-02.
# Gemma is open-weight, which is what keeps this project's "open-source AI"
# claim honest. Re-check this id if the catalog moves, a wrong id fails as a
# 404 from the inference API, not as an obvious config error.
MODEL = "gemma-4-31B-it"

# DO_INFERENCE_KEY is a secret, never put it here.
# Set it with:  npx wrangler secret put DO_INFERENCE_KEY
